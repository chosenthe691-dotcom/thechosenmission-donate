<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheChosenMission Donation</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:0;
}
.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}
h1{
    text-align:center;
    color:#333;
}
p{
    text-align:center;
    color:#666;
}
input, textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}
.donate-btn{
    display:block;
    width:100%;
    background:#0070ba;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
}
.donate-btn:hover{
    background:#005ea6;
}
</style>
</head>
<body>

<div class="container">
    <h1>🙏 TheChosenMission</h1>

    <p>
        Thank you for supporting our mission.
        Your generosity helps us spread the Gospel and serve others.
    </p>

    <input type="text" placeholder="Your Name">

    <input type="email" placeholder="Your Email">

    <textarea rows="5" placeholder="Message / Prayer Request"></textarea>

    <a class="donate-btn"
       href="https://paypal.me/TheChosenMission"
       target="_blank">
       ❤️ Donate Now
    </a>

</div>

</body>
</html>
