<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheChosenMission Donation</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h1,h2{
    text-align:center;
    color:#333;
}

p{
    text-align:center;
    color:#666;
}

.amounts{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:20px;
}

.amount-btn{
    background:#28a745;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.donate-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#0070ba;
    color:white;
    padding:15px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h1>🙏 TheChosenMission</h1>

<p>
Thank you for supporting our mission.
Your generosity helps us spread the Gospel and serve others.
</p>

<h2>❤️ One-Time Donation</h2>

<div class="amounts">
<div class="amount-btn">$25</div>
<div class="amount-btn">$100</div>
<div class="amount-btn">$500</div>
<div class="amount-btn">Other Amount</div>
</div>

<h2>🌟 Monthly Membership</h2>

<div class="amounts">
<div class="amount-btn">$10/month</div>
<div class="amount-btn">$25/month</div>
<div class="amount-btn">$75/month</div>
<div class="amount-btn">$100/month</div>
</div>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea rows="5" placeholder="Message / Prayer Request"></textarea>

<a class="donate-btn"
href="https://paypal.me/TheChosenMission"
target="_blank">
❤️ Donate Now
</a>

</div>

</body>
</html>
