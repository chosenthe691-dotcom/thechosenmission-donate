<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheChosenMission - Donate</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.hero{
    background:url('https://images.unsplash.com/photo-1504052434569-70ad5836ab65?w=1200') center/cover;
    height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero h1{
    color:white;
    text-align:center;
    background:rgba(0,0,0,.5);
    padding:15px 25px;
    border-radius:10px;
}

.container{
    max-width:600px;
    margin:-40px auto 40px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
}

.amounts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin:20px 0;
}

.btn{
    display:block;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:10px;
    font-weight:bold;
    background:#005ea6;
    color:white;
}

.paypal{
    background:#0070ba;
}

.monthly{
    background:#28a745;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#666;
}
</style>
</head>

<body>

<div class="hero">
    <h1>TheChosenMission</h1>
</div>

<div class="container">

<h2>Support Our Ministry</h2>

<p style="text-align:center">
Help us spread the Gospel of Jesus Christ around the world.
Every donation helps us create faith-based content and reach more people.
</p>

<div class="amounts">

<a class="btn paypal"
href="https://www.paypal.me/TheChosenMission/25">
Donate $25
</a>

<a class="btn paypal"
href="https://www.paypal.me/TheChosenMission/100">
Donate $100
</a>

<a class="btn paypal"
href="https://www.paypal.me/TheChosenMission/500">
Donate $500
</a>

<a class="btn paypal"
href="https://www.paypal.me/TheChosenMission">
Other Amount
</a>

</div>

<a class="btn monthly"
href="https://www.paypal.me/TheChosenMission">
Monthly Donation
</a>

<div class="footer">
🙏 Thank you for supporting TheChosenMission
</div>

</div>

</body>
</html>
