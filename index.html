<!DOCTYPE html>
<html>
<head>
<title>SuperThanks Donation</title>

<style>
body{
    font-family: Arial;
    background:#0f0f0f;
    color:white;
    display:flex;
    justify-content:center;
}

.container{
    width:420px;
    margin-top:30px;
}

.card{
    background:#1c1c1c;
    padding:20px;
    border-radius:15px;
}

button{
    width:100%;
    padding:15px;
    margin:5px 0;
    border:none;
    border-radius:10px;
}

.amount{ background:#333; color:white; }
.pay{ background:gold; color:black; font-weight:bold; }
</style>

</head>

<body>

<div class="container">

<h2>Walk with us in faith</h2>

<div class="card">

<input id="name" placeholder="Name" style="width:100%;padding:10px;">
<input id="email" placeholder="Email" style="width:100%;padding:10px;margin-top:5px;">

<button class="amount" onclick="setAmount(10)">$10</button>
<button class="amount" onclick="setAmount(25)">$25</button>
<button class="amount" onclick="setAmount(100)">$100</button>
<button class="amount" onclick="setAmount(500)">$500</button>

<h3 id="selected">Selected: $25</h3>

<button class="pay" onclick="donate()">Donate with PayPal</button>

</div>

<h3>🔥 Live Leaderboard</h3>
<div id="board"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
